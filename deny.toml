# cargo-deny configuration (spec §C8, §D2).
[advisories]
version = 2
yanked = "warn"
# rustls-webpki 0.102.8 (Serenity's gateway TLS chain via tokio-tungstenite
# 0.21 and rustls 0.22) has no patched 0.102 release. Serenity 0.12.x (S-9)
# pins that dependency line, and native-tls is banned (OpenSSL). These specific
# advisories are accepted only for that unfixable transitive version. Re-run
# cargo-deny after any Serenity bump and remove exceptions once the dependency
# moves to patched rustls-webpki (COMPAT.md).
ignore = [
    { id = "RUSTSEC-2026-0049", reason = "webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0098", reason = "webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0099", reason = "webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0104", reason = "webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0346", reason = "rustls/webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0347", reason = "rustls/webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0348", reason = "rustls/webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0349", reason = "rustls/webpki 0.102 line unfixable; forced by serenity 0.12 S-9 pin; loopback bot" },
    { id = "RUSTSEC-2026-0382", reason = "rustls-webpki 0.102.8 has no patched 0.102 release; forced by serenity 0.12.x via tokio-tungstenite 0.21; remove after dependency upgrade" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    # Community Data License Agreement Permissive 2.0 — the license of
    # `webpki-roots`, part of the rustls trust-anchor stack (reqwest).
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Bootstrap rule: run `cargo deny check` once in Phase 0 against the real
# dependency graph. Every additional transitive license observed is either
# added here deliberately (recorded in the PR) or the dependency is replaced.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The rustls decision (no OpenSSL) is enforced here.
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
