# CI gate for ocbot (SPEC-CI-001 FR-2) — required on `main` via the ruleset
# applied by scripts/apply-governance.sh (P9).
#
# Coverage gates are per crate (`scripts/coverage.sh`, the enforcement):
# workspace >= 85, core >= 90, client >= 90, shell >= 80. Mutation testing is
# scoped to the PR/push diff (4 shards) here; the full-core run lives in
# nightly.yml. No path filters on this gate (D-6): a required check must always
# report, so docs-only PRs run the full suite on purpose.
#
# Supply chain (D-4/D-5): every `uses:` is a full 40-char commit SHA with the
# tag in a trailing comment; taiki-e tool versions pinned 2026-11-08.
# Dependabot (github-actions + cargo, weekly) proposes the bumps; gate G25
# keeps any floating ref red.
#
# Every job checks out first, then uses the composite setup action: a local
# action cannot be a job's first step (the runner reads its action.yml from
# the workspace, which is empty before checkout).

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # actionlint is not in taiki-e/install-action's catalog and not on
      # crates.io, so install the pinned release binary directly and verify it
      # against the release's own checksums file.
      - name: Install actionlint v1.7.12 (checksum-verified)
        run: |
          set -euo pipefail
          tag="v1.7.12"
          base="https://github.com/rhysd/actionlint/releases/download/$tag"
          asset="actionlint_1.7.12_linux_amd64.tar.gz"
          curl -sSLo "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -sSLo "$RUNNER_TEMP/checksums.txt" "$base/actionlint_1.7.12_checksums.txt"
          (cd "$RUNNER_TEMP" && grep "$asset" checksums.txt | sha256sum -c -)
          tar xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # Local composite actions under .github/actions/ are validated
      # transitively via the `uses: ./...` references in these workflows
      # (passing an action.yml explicitly makes actionlint parse it as a
      # workflow and fail spuriously).
      - run: actionlint .github/workflows/*.yml

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151
      # --profile ci writes target/nextest/ci/junit.xml (.config/nextest.toml)
      - run: cargo nextest run --workspace --locked --profile ci
      - run: cargo test --doc --workspace --locked
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --locked
      # FR-10/NFR-6: upload the JUnit report on EVERY run (if: always() is the
      # one legitimate use — a failed run is exactly when it is needed)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ github.run_id }}
          path: target/nextest/ci/junit.xml
          retention-days: 30

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      # --locked is a global cargo-deny flag: it goes before the subcommand
      - run: cargo deny --locked check

  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: ./scripts/gates.sh

  coverage:
    # Per-crate line-coverage gates (NFR-4): workspace >= 85, core >= 90,
    # client >= 90, shell >= 80 — enforced by scripts/coverage.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov@0.9.1
      # scripts/coverage.sh exports lcov.info on the workspace gate
      - run: ./scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lcov-${{ github.run_id }}
          path: lcov.info
          retention-days: 30

  mutants:
    # Mutate only changed core production lines per PR/push. Four round-robin
    # shards run concurrently; their union tests every mutant in the diff.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: "0"
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate changed core code
        env:
          MUTANT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          MUTANT_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          diff_file="$RUNNER_TEMP/core-mutants.diff"
          if [[ "$MUTANT_BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --root --no-commit-id -p --unified=0 "$MUTANT_HEAD_SHA" > "$diff_file"
          else
            git diff --no-ext-diff --unified=0 "$MUTANT_BASE_SHA" "$MUTANT_HEAD_SHA" > "$diff_file"
          fi
          if ! grep -qE '^diff --git a/crates/ocbot-core/src/[^ ]+\.rs b/crates/ocbot-core/src/[^ ]+\.rs$' "$diff_file"; then
            echo "No ocbot-core production source changed; skipping scoped mutation run."
            exit 0
          fi
          cargo mutants \
            --in-diff "$diff_file" \
            --shard ${{ matrix.shard }}/4 \
            --sharding round-robin \
            --file 'crates/ocbot-core/src/**/*.rs' \
            --test-package ocbot-core \
            --cargo-arg=--locked

  machete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  typos:
    # Docs-side spelling check. `devdocs/` is gitignored (local spec/phase
    # notes); check the committed docs tree only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: typos-cli@1.52.0
      - run: typos docs README.md

  client-publish-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - run: cargo publish --dry-run --locked -p opencode-v2-client

  notify:
    # D-9/FR-10/NFR-6: a red `main` opens exactly one `ci-failure` issue; a
    # green `main` run closes it. Runs on main only — never on PRs. `always()`
    # is required so the job still runs when a needed gate failed; the step
    # conditions pick open-vs-close.
    needs: [lint-workflows, fmt, lint, test, deny, gates, coverage, mutants, machete, typos, client-publish-dry-run]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: failure()
        with:
          script: |
            const label = 'ci-failure';
            const { owner, repo } = context.repo;
            // issues.create 422s on an unknown label — ensure it exists first
            try { await github.rest.issues.getLabel({ owner, repo, name: label }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'CI red on main (SPEC-CI-001 D-9); auto-closed on green' }); }
            // search-before-create: exactly one open ci-failure issue at a time
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 10 });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner, repo,
                title: `CI red on main — run ${context.runId}`,
                body: `ci run ${context.runId} failed on main: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nOne open issue is kept at a time; it closes automatically when a later main run goes green.`,
                labels: [label],
              });
              console.log('opened ci-failure issue');
            } else {
              console.log(`ci-failure issue already open (#${open.data[0].number}); not duplicating`);
            }
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: success()
        with:
          script: |
            const label = 'ci-failure';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            for (const issue of open.data) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }
            console.log(`closed ${open.data.length} ci-failure issue(s)`);
