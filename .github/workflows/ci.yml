# CI for ocbot — job matrix (spec Part 2 §D4).
#
# Coverage gates are per crate (`scripts/coverage.sh`): core ≥ 90, client ≥ 90,
# shell ≥ 70. Mutation testing is scoped per PR and full-core nightly. The
# nightly job also runs cargo-fuzz serde targets, the live contract suite, and
# the real-SIGKILL chaos half.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly: fuzz + live contract against the pinned opencode version.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all -- --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace
      - run: cargo test --doc --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  machete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: ./scripts/gates.sh

  coverage:
    # Per-crate line-coverage gates (NFR-8): core ≥ 90, client ≥ 90, shell ≥ 70.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: ./scripts/coverage.sh

  mutants:
    # Scoped mutation check for the diff (NFR-8); nightly runs the full core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - run: >-
          cargo mutants
          --file crates/ocbot-core/src/state.rs
          --file crates/ocbot-core/src/render/mod.rs
          --file crates/ocbot-core/src/render/report.rs
          --file crates/ocbot-core/src/render/gate.rs
          --file crates/ocbot-core/src/render/browser.rs
          --file crates/ocbot-core/src/render/redact.rs
          --file crates/ocbot-core/src/render/label.rs
          --file crates/ocbot-core/src/history.rs
          --file crates/ocbot-core/src/plan.rs
          --file crates/ocbot-core/src/paths.rs
          --test-package ocbot-core
        continue-on-error: false

  typos:
    # Docs-side spelling check (Phase 7 exit criteria).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: typos-cli
      # `devdocs/` is gitignored (local spec/phase notes); check the committed
      # docs tree only.
      - run: typos docs README.md

  client-publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo publish --dry-run -p opencode-v2-client

  nightly:
    # Fuzz serde targets + live contract suite against the pinned opencode
    # version (R-1 detection) + the full mutation run + real-SIGKILL chaos.
    # Only runs on schedule / manual dispatch.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - job: fuzz
          - job: contract
          - job: mutants-full
          - job: sigkill
    steps:
      - uses: actions/checkout@v4
      - if: matrix.job == 'fuzz'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
      - if: matrix.job != 'fuzz'
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - if: matrix.job == 'fuzz'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - if: matrix.job == 'fuzz'
        run: cargo fuzz run serde_fuzz --sanitizer address -- -max_total_time=120
        working-directory: fuzz
      - if: matrix.job == 'contract'
        env:
          OPENCODE_URL: ${{ vars.OPENCODE_URL }}
          OPENCODE_PASSWORD: ${{ secrets.OPENCODE_PASSWORD }}
          SPIKE_DIR: /tmp/opencode/ci-contract
        run: |
          if [ -z "$OPENCODE_URL" ] || [ -z "$OPENCODE_PASSWORD" ]; then
            echo "nightly contract: OPENCODE_URL/OPENCODE_PASSWORD not configured; skipping"
            exit 0
          fi
          cargo run -q -p opencode-v2-client --example spike
      - if: matrix.job == 'mutants-full'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - if: matrix.job == 'mutants-full'
        run: cargo mutants -p ocbot-core --test-package ocbot-core
      - if: matrix.job == 'sigkill'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: matrix.job == 'sigkill'
        # The real-SIGKILL half of AC-6: spawn the harness, kill it at each
        # labelled point, and prove boot reconcile recovers.
        run: cargo nextest run -p ocbot --test chaos_sigkill --retries 2