# Composite setup used by every CI job (SPEC-CI-001 §3.1): the pinned Rust
# toolchain + the cargo cache. Every job runs `actions/checkout` BEFORE this —
# a local action cannot be a job's first step, because the runner reads the
# action's action.yml from the checked-out workspace (observed live on runner
# 2.338.2: "Can't find 'action.yml' ... Did you forget to run actions/checkout
# before running your local action?").
#
# External action references are full commit SHAs with the tag in a trailing
# comment (D-4); Dependabot (github-actions ecosystem) proposes SHA bumps.
name: setup-rust
description: pinned Rust toolchain + cargo cache (SPEC-CI-001) — use after actions/checkout
inputs:
  nightly:
    description: install the nightly toolchain (fuzz only)
    required: false
    default: "false"
  cache:
    description: enable the cargo cache (keyed on Cargo.lock, restore-only)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      with:
        # empty toolchain input = the action reads rust-toolchain.toml (1.98.1)
        toolchain: ${{ inputs.nightly == 'true' && 'nightly' || '' }}
        cache: ${{ inputs.cache }}
